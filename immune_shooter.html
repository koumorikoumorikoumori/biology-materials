<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>免疫防衛戦 — 白血球シューティング</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap');

  :root{
    /* NES-inspired punchy palette */
    --bg:#0b0221;          /* deep purple-black */
    --bg2:#1a0a3a;
    --scr:#100a2e;         /* screen fill */
    --white:#fcfcfc;
    --antibody:#3ff0d0;    /* cyan */
    --antibody-glow:#7bffe6;
    --pathogen:#ff4060;    /* red */
    --virus:#c060ff;       /* purple */
    --toxin:#ffd000;       /* yellow */
    --green:#40e060;
    --ink:#e8e0ff;
    --muted:#8878b8;
    --panel:#241147;
    --pxl:3px;             /* pixel unit */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'DotGothic16','Press Start 2P',monospace;
    background:
      repeating-linear-gradient(0deg, #07021a 0 2px, #0b0428 2px 4px),
      var(--bg);
    color:var(--ink);
    display:flex;justify-content:center;align-items:center;
    min-height:100vh;padding:16px;overflow:hidden;
    image-rendering:pixelated;
  }

  /* ---- CRT screen frame ---- */
  #stage{
    position:relative;width:min(900px,100%);aspect-ratio:3/2;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 50% 40%, #180b3a, var(--scr) 80%);
    overflow:hidden;
    outline:none;
    /* chunky stacked pixel border */
    box-shadow:
      0 0 0 var(--pxl) #000,
      0 0 0 calc(var(--pxl)*2) var(--antibody),
      0 0 0 calc(var(--pxl)*3) #000,
      0 0 0 calc(var(--pxl)*5) var(--panel),
      0 0 0 calc(var(--pxl)*6) #000,
      0 0 40px rgba(63,240,208,.25);
  }
  /* CRT scanline + vignette overlay on top of everything */
  #stage::after{
    content:"";position:absolute;inset:0;z-index:40;pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 4px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5) 100%);
    mix-blend-mode:multiply;
  }
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}

  /* ---- HUD ---- */
  #hud{
    position:absolute;top:0;left:0;right:0;display:flex;
    justify-content:space-between;align-items:flex-start;
    padding:14px 16px;pointer-events:none;z-index:6;
    font-family:'Press Start 2P',monospace;
  }
  .hud-block{display:flex;flex-direction:column;gap:6px}
  .hud-label{font-size:8px;letter-spacing:0;color:var(--muted)}
  .hud-value{font-size:18px;line-height:1;color:var(--white);text-shadow:2px 2px 0 #000}
  #score .hud-value{color:var(--toxin)}
  #hud-center{align-items:center}
  #hud-right{align-items:flex-end}
  #hearts{display:flex;gap:3px;font-size:14px}
  #waveTag{font-size:10px;color:var(--antibody-glow);text-shadow:2px 2px 0 #000}

  #combo{
    position:absolute;top:66px;left:50%;transform:translateX(-50%);
    font-family:'Press Start 2P',monospace;font-size:14px;
    color:var(--toxin);opacity:0;pointer-events:none;z-index:6;
    text-shadow:2px 2px 0 #000;transition:opacity .1s;
  }

  #muteBtn{
    position:absolute;bottom:12px;right:12px;z-index:45;
    width:34px;height:34px;cursor:pointer;
    background:var(--panel);color:var(--white);
    border:none;box-shadow:0 0 0 2px #000, 3px 3px 0 #000;
    font-size:14px;line-height:1;
    font-family:'Press Start 2P',monospace;
  }
  #muteBtn:active{transform:translate(2px,2px);box-shadow:0 0 0 2px #000,1px 1px 0 #000}
  #muteBtn:focus-visible{outline:2px solid var(--toxin);outline-offset:2px}

  #ticker{
    position:absolute;bottom:0;left:0;right:0;z-index:6;
    background:linear-gradient(transparent, rgba(11,2,33,.92) 40%);
    padding:24px 14px 12px;pointer-events:none;display:flex;align-items:center;gap:8px;
    font-family:'DotGothic16',monospace;font-size:13px;color:var(--ink);
    opacity:0;transition:opacity .2s;
  }
  #ticker.show{opacity:1}
  #ticker .tag{
    flex-shrink:0;font-family:'Press Start 2P',monospace;font-size:8px;
    padding:5px 7px;background:var(--antibody);color:#001;
    box-shadow:2px 2px 0 #000;
  }
  #ticker b{color:var(--toxin)}

  /* ---- overlays ---- */
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 2px, transparent 2px 4px),
      rgba(11,2,33,.94);
    padding:24px;gap:18px;z-index:20;overflow-y:auto;
  }
  .overlay.hidden{display:none}
  .eyebrow{
    font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:.05em;
    color:var(--antibody);text-shadow:2px 2px 0 #000;
  }
  h1{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(20px,5.2vw,40px);line-height:1.25;color:var(--white);
    text-shadow:3px 3px 0 var(--pathogen), 6px 6px 0 #000;
  }
  h1 .accent{color:var(--toxin);text-shadow:3px 3px 0 var(--virus),6px 6px 0 #000}
  .lead{
    font-family:'DotGothic16',monospace;max-width:440px;
    font-size:14px;line-height:1.9;color:var(--ink);
  }
  .lead b{color:var(--toxin)}
  .keys{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
    font-family:'Press Start 2P',monospace;font-size:9px;color:var(--muted)}
  .keys kbd{
    font-family:'Press Start 2P',monospace;background:var(--panel);
    box-shadow:0 0 0 2px #000, 2px 2px 0 #000;padding:5px 7px;
    color:var(--white);font-size:9px;margin-right:3px;display:inline-block;
  }
  .legend{display:flex;gap:8px 16px;flex-wrap:wrap;justify-content:center;max-width:520px}
  .legend div{display:flex;align-items:center;gap:6px;
    font-family:'DotGothic16',monospace;font-size:12px;color:var(--ink)}
  .dot{width:12px;height:12px;box-shadow:0 0 0 2px #000;image-rendering:pixelated}

  input.name{
    font-family:'Press Start 2P',monospace;font-size:14px;text-align:center;
    background:var(--scr);color:var(--toxin);
    border:none;box-shadow:0 0 0 3px #000, 0 0 0 6px var(--antibody), 0 0 0 9px #000;
    padding:14px 16px;width:min(300px,80vw);letter-spacing:.05em;
  }
  input.name::placeholder{color:var(--muted);font-size:11px}
  input.name:focus{outline:none;box-shadow:0 0 0 3px #000, 0 0 0 6px var(--toxin), 0 0 0 9px #000}

  /* chunky pixel buttons */
  button.play,button.ghost{
    font-family:'Press Start 2P',monospace;cursor:pointer;
    border:none;position:relative;
  }
  button.play{
    font-size:13px;color:#001;background:var(--toxin);
    padding:15px 26px;box-shadow:0 0 0 3px #000, 5px 5px 0 #000;
  }
  button.play:hover{background:var(--antibody-glow)}
  button.play:active{transform:translate(3px,3px);box-shadow:0 0 0 3px #000,2px 2px 0 #000}
  button.play:focus-visible{outline:3px solid var(--white);outline-offset:3px}
  button.ghost{
    font-size:11px;color:var(--white);background:var(--panel);
    padding:13px 20px;box-shadow:0 0 0 3px #000, 4px 4px 0 #000;
  }
  button.ghost:hover{background:var(--virus)}
  button.ghost:active{transform:translate(2px,2px);box-shadow:0 0 0 3px #000,2px 2px 0 #000}
  button.ghost:focus-visible{outline:3px solid var(--toxin);outline-offset:3px}

  .final-score{
    font-family:'Press Start 2P',monospace;font-size:clamp(34px,9vw,52px);
    color:var(--toxin);line-height:1;text-shadow:4px 4px 0 #000;
  }
  .rank{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--antibody-glow);
    line-height:1.6;text-shadow:2px 2px 0 #000}
  .newbest{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--pathogen);
    text-shadow:2px 2px 0 #000;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .fact-card{
    max-width:430px;background:var(--scr);
    box-shadow:0 0 0 3px #000, 0 0 0 6px var(--virus), 0 0 0 9px #000;
    padding:16px 18px;font-family:'DotGothic16',monospace;
    font-size:13px;line-height:1.9;color:var(--ink);
  }
  .fact-card b{color:var(--toxin)}
  .fact-card .tag{font-family:'Press Start 2P',monospace;font-size:8px;
    color:var(--virus);display:block;margin-bottom:8px}

  .rank-wrap{width:min(440px,92%)}
  .rank-title{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--muted);margin-bottom:12px}
  table.rank-table{width:100%;border-collapse:collapse;
    font-family:'Press Start 2P',monospace;font-size:10px}
  table.rank-table td{padding:9px 5px;border-bottom:2px solid #000;text-align:left}
  table.rank-table .pos{width:38px;color:var(--muted)}
  table.rank-table .nm{color:var(--white);font-family:'DotGothic16',monospace;font-size:13px}
  table.rank-table .sc{text-align:right;color:var(--toxin)}
  table.rank-table tr.me td{background:var(--panel)}
  table.rank-table tr.me .pos{color:var(--pathogen)}
  .empty{color:var(--muted);font-family:'DotGothic16',monospace;font-size:13px;padding:16px}
  .hint{font-family:'DotGothic16',monospace;font-size:12px;color:var(--muted)}
  /* blinking press-start style prompt */
  .hint.blink{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--antibody-glow);
    animation:blink 1.1s steps(1) infinite}

  @media (prefers-reduced-motion: reduce){
    .newbest,.hint.blink{animation:none}
  }
  @media (max-width:560px){
    :root{--pxl:2px}
    .hud-value{font-size:14px}
    h1{font-size:22px}
  }
</style>
</head>
<body>
<div id="stage" tabindex="0">
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="score" class="hud-block">
      <span class="hud-label">Score</span>
      <span class="hud-value" id="scoreVal">0</span>
    </div>
    <div id="hud-center" class="hud-block">
      <span class="hud-label">経過</span>
      <span id="waveTag">WAVE 1</span>
    </div>
    <div id="hud-right" class="hud-block">
      <span class="hud-label">生体防御</span>
      <span class="hud-value"><span id="hearts"></span></span>
    </div>
  </div>

  <div id="combo"></div>

  <button id="muteBtn" title="音のオン/オフ">🔊</button>

  <div id="ticker">
    <span class="tag" id="tickerTag">免疫メモ</span>
    <span id="tickerText"></span>
  </div>

  <!-- NAME ENTRY -->
  <div class="overlay" id="nameScreen">
    <span class="eyebrow">- 生体防御と免疫 -</span>
    <h1>免疫<span class="accent">防衛戦</span></h1>
    <p class="lead">あなたは<b>白血球</b>。侵入する病原体を<b>抗体</b>で撃退せよ。
      時間が経つほど感染は激化する。どこまで耐えられるか！</p>
    <input class="name" id="nameInput" maxlength="10" placeholder="NAME" autocomplete="off">
    <div class="keys">
      <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> いどう</span>
      <span><kbd>SPACE</kbd> はっしゃ</span>
    </div>
    <div class="legend">
      <div><span class="dot" style="background:var(--pathogen)"></span>細菌</div>
      <div><span class="dot" style="background:var(--virus)"></span>ウイルス（速い）</div>
      <div><span class="dot" style="background:var(--toxin)"></span>マクロファージ（味方）</div>
    </div>
    <div class="legend">
      <div><span class="dot" style="background:var(--pathogen)"></span>L：レーザー</div>
      <div><span class="dot" style="background:var(--antibody-glow)"></span>C：連射</div>
      <div><span class="dot" style="background:var(--toxin)"></span>補：3方向</div>
      <div><span class="dot" style="background:var(--antibody)"></span>T：バリア</div>
    </div>
    <button class="play" id="startBtn">START</button>
    <span class="hint blink">PRESS START</span>
  </div>

  <!-- GAME OVER -->
  <div class="overlay hidden" id="overScreen">
    <span class="eyebrow">- GAME OVER -</span>
    <div class="newbest hidden" id="newBest">NEW RECORD!!</div>
    <div class="final-score" id="finalScore">0</div>
    <div class="rank" id="rankText"></div>
    <div class="fact-card" id="factCard"></div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">
      <button class="play" id="againBtn">RETRY</button>
      <button class="ghost" id="rankBtn">RANKING</button>
    </div>
  </div>

  <!-- RANKING -->
  <div class="overlay hidden" id="rankScreen">
    <span class="eyebrow">- HIGH SCORE -</span>
    <h1 style="font-size:clamp(18px,4.5vw,30px)">ランキング</h1>
    <div class="rank-wrap">
      <div class="rank-title">TOP 10</div>
      <div id="rankBody"></div>
    </div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">
      <button class="play" id="rankAgainBtn">PLAY</button>
      <button class="ghost" id="clearBtn">CLEAR DATA</button>
    </div>
  </div>
</div>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const stage=document.getElementById('stage');
let W,H,DPR;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=cv.getBoundingClientRect();
  W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=false;
}
window.addEventListener('resize',resize);

// ---------- ranking storage ----------
const RKEY='immuneShooterRanking_v1';
let playerName='';
function loadRanking(){
  try{return JSON.parse(localStorage.getItem(RKEY))||[]}catch(e){return[]}
}
function saveScore(name,sc){
  const list=loadRanking();
  const entry={name,score:sc,ts:Date.now()};
  list.push(entry);
  list.sort((a,b)=>b.score-a.score);
  const top=list.slice(0,10);
  try{localStorage.setItem(RKEY,JSON.stringify(top))}catch(e){}
  return {top, rank:list.indexOf(entry)+1, isBest:list[0]===entry, entry};
}
function renderRanking(highlightEntry){
  const list=loadRanking();
  const body=document.getElementById('rankBody');
  if(!list.length){body.innerHTML='<div class="empty">まだ記録がありません。最初の白血球になろう。</div>';return;}
  let html='<table class="rank-table">';
  list.forEach((e,i)=>{
    const me = highlightEntry && e.ts===highlightEntry.ts && e.score===highlightEntry.score ? ' class="me"':'';
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    html+='<tr'+me+'><td class="pos">'+medal+'</td><td class="nm">'+escapeHtml(e.name)+'</td><td class="sc">'+e.score+'</td></tr>';
  });
  html+='</table>';
  body.innerHTML=html;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// ---------- immunology facts ----------
const facts=[
  {tag:'免疫メモ',t:'<b>抗体</b>は抗原に特異的に結合するタンパク質。無毒化や目印付けを担う。'},
  {tag:'免疫メモ',t:'<b>体液性免疫</b>ではB細胞が抗体を放出して病原体を攻撃する。'},
  {tag:'免疫メモ',t:'<b>マクロファージ</b>は病原体を取り込む食作用を行う自然免疫の担い手。'},
  {tag:'免疫メモ',t:'感染細胞は<b>キラーT細胞</b>が直接攻撃する（細胞性免疫）。'},
  {tag:'免疫メモ',t:'一度侵入した病原体を<b>記憶細胞</b>が覚え、二度目は素早く強く反応する。'},
  {tag:'免疫メモ',t:'<b>ヘルパーT細胞</b>はB細胞やキラーT細胞を活性化する司令塔。'},
  {tag:'免疫メモ',t:'皮膚や粘膜による防御は病原体に対する<b>第一の壁</b>だ。'},
];
let usedFact=0;
const endFacts=[
  {tag:'ワクチンの原理',t:'ワクチンは弱毒化・無毒化した抗原を接種し、<b>記憶細胞</b>を作らせて次の感染に備える。'},
  {tag:'アレルギー',t:'花粉など無害な物質への免疫の過剰反応が<b>アレルギー</b>。免疫は強すぎても困る。'},
  {tag:'血液型',t:'ABO式の不適合輸血で血液が固まるのは、赤血球の抗原と血しょう中の<b>抗体</b>が反応するため。'},
  {tag:'自然免疫と獲得免疫',t:'食作用など生まれつきの<b>自然免疫</b>と、抗体などで特異的に働く<b>獲得免疫</b>が連携する。'},
];

// ---------- audio (Web Audio API, no external files) ----------
let audioCtx=null, masterGain=null, musicOn=true, musicTimer=null, musicStep=0;
function ensureAudio(){
  if(audioCtx)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    audioCtx=new AC();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=0.5;
    masterGain.connect(audioCtx.destination);
  }catch(e){audioCtx=null;}
}
function beep(freq,dur,type,vol,when){
  if(!audioCtx||!freq)return;
  const t=(when||audioCtx.currentTime);
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type=type||'square';o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol||0.2,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g);g.connect(masterGain);
  o.start(t);o.stop(t+dur+0.02);
}
// noise burst for drums (8-bit風スネア/ハイハット)
function noise(dur,vol,when){
  if(!audioCtx)return;
  const t=(when||audioCtx.currentTime);
  const n=Math.floor(audioCtx.sampleRate*dur);
  const buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const src=audioCtx.createBufferSource();src.buffer=buf;
  const g=audioCtx.createGain();g.gain.value=vol||0.1;
  const hp=audioCtx.createBiquadFilter();hp.type='highpass';hp.frequency.value=3000;
  src.connect(hp);hp.connect(g);g.connect(masterGain);
  src.start(t);src.stop(t+dur);
}

// ---- 8-bit driving tune (ロックマン風ステージBGM) ----
// note frequencies
const N={ 0:0,
  A2:110.00,B2:123.47,C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196.00,
  A3:220.00,B3:246.94,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,
  A4:440.00,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.00 };
// 32-step lead melody (fast, minor-key, syncopated) — 2 bars, loops
const LEAD=[
  N.A4,0,N.C5,N.A4, N.E5,0,N.D5,N.C5, N.B4,0,N.C5,N.B4, N.A4,0,N.E4,0,
  N.A4,0,N.C5,N.E5, N.A5,0,N.G5,N.E5, N.F5,N.E5,N.D5,N.C5, N.B4,0,N.G4,0
];
// bassline follows the chord roots, steady eighths feel
const BASS=[
  N.A2,N.A2,N.A3,N.A2, N.A2,N.A2,N.A3,N.A2, N.F3,N.F3,N.F3,N.A2, N.E3,N.E3,N.E3,N.E3,
  N.A2,N.A2,N.A3,N.A2, N.A2,N.A2,N.A3,N.A2, N.D3,N.D3,N.F3,N.A2, N.E3,N.E3,N.G3,N.B3
];
function musicTick(){
  if(!audioCtx||!musicOn||state!=='play')return;
  const s=musicStep%32;
  const now=audioCtx.currentTime;
  // lead (square, slight detune second voice for thickness)
  if(LEAD[s]){ beep(LEAD[s],0.13,'square',0.10,now); beep(LEAD[s]*1.005,0.13,'square',0.04,now); }
  // bass (triangle)
  if(BASS[s]) beep(BASS[s],0.14,'triangle',0.16,now);
  // drums: kick on 0/8/16/24, snare on 4/12/20/28, hats on evens
  if(s%8===0){ beep(70,0.12,'sine',0.22,now); }
  if(s%8===4){ noise(0.10,0.14,now); }
  if(s%2===0){ noise(0.03,0.04,now); }
  musicStep++;
}
function startMusic(){
  ensureAudio();
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  if(musicTimer)clearInterval(musicTimer);
  musicStep=0;
  // 16th-note step at ~150 BPM => ~100ms/step (アップテンポで疾走感)
  musicTimer=setInterval(musicTick,105);
}
function stopMusic(){ if(musicTimer){clearInterval(musicTimer);musicTimer=null;} }

// ---------- DIFFICULTY: escalates relentlessly with time ----------
function difficulty(){
  const t=elapsed/1000;
  // 序盤(0-20s)は非常にゆるやか、中盤(20-50s)で本格化、後半(50s-)で理不尽に加速
  // ease: 最初の立ち上がりを抑える二次カーブ
  const ramp = t<20 ? t*0.35              // 0〜7  ゆっくり
             : t<50 ? 7 + (t-20)*0.9      // 7〜34 中速で難化
                    : 34 + (t-50)*1.9;    // 34〜  急加速（理不尽ゾーン）
  return {
    // 出現間隔：最初は1.4秒とゆったり → 徐々に詰まる
    gap: Math.max(240, 1400 - ramp*26),
    // 敵の落下速度：序盤は遅い
    speed: 0.6 + ramp*0.028,
    // ウイルス出現率：序盤はほぼ細菌のみ
    virusChance: Math.min(0.55, Math.max(0, (t-8)*0.012)),
    // タンク型：20秒以降から
    tankChance: Math.min(0.5, Math.max(0,(t-20))*0.011),
    // 同時湧きバースト：45秒以降のみ
    burst: t>45 ? (Math.random()<Math.min(0.45,(t-45)*0.012)?1+Math.floor(Math.random()*2):0) : 0,
    // 横揺れ：序盤は真っすぐ落ちる
    weave: Math.min(1.7, Math.max(0,(t-10))*0.02),
    // 追尾ウイルスが出始める時刻の目安（spawnOne側で使用）
    homingT: t,
  };
}
function spawnOne(d){
  const roll=Math.random();
  let type;
  // 序盤は味方マクロファージも控えめ、細菌中心
  if(roll<0.10) type='ally';
  else if(roll<0.10+d.virusChance) type='virus';
  else type='bacteria';
  const x=30+Math.random()*(W-60);
  const isTank = type==='bacteria' && Math.random()<d.tankChance;
  const e={
    x,y:-30,type,
    r: type==='virus'?14: type==='ally'?20: (isTank?20:17),
    wob:Math.random()*Math.PI*2,
    weave:d.weave*(0.6+Math.random()*0.8),
    hp: type==='bacteria'?(isTank?4:2):1,
    maxhp: type==='bacteria'?(isTank?4:2):1,
    dive: type==='virus' && elapsed>30000 && Math.random()<Math.min(0.5, (elapsed/1000-30)*0.012),
  };
  const spd=d.speed;
  e.vy = type==='virus'? spd*1.7 : type==='ally'? spd*0.95 : spd*(isTank?0.8:1);
  enemies.push(e);
}
function updateWave(){
  const w=1+Math.floor(elapsed/15000);
  if(w!==wave){wave=w;document.getElementById('waveTag').textContent='WAVE '+wave;}
}

function shoot(){
  const y=cell.y-20;
  // レーザーレベルで1発の威力・見た目が変わる（ゼビウス風の段階強化）
  // lv1:通常 lv2:強化弾 lv3:高速強化弾 lv4:貫通レーザー
  const power = laserLevel>=4?3 : laserLevel>=3?2 : laserLevel>=2?2 : 1;
  const pierce = laserLevel>=4;
  const speed = laserLevel>=3? -11 : -8;
  const mk=(vx,vy)=>({x:cell.x,y,vx,vy,power,pierce,laser:laserLevel>=4,lv:laserLevel,hitIds:pierce?[]:null});
  if(powerLevel>=3){
    // 補体：3方向拡散
    bullets.push(mk(0,speed));
    bullets.push(mk(-2.6,speed*0.95));
    bullets.push(mk(2.6,speed*0.95));
  }else if(laserLevel>=2){
    // 強化時は2連射（ツイン）
    bullets.push(mk(-6,speed));
    bullets.push(mk(6,speed));
  }else{
    bullets.push(mk(0,speed));
  }
  // サイトカイン（連射）：レベル2以上で発射間隔が短い。レーザーが上がるとさらに速い
  const base = powerLevel>=2 ? 95 : 170;
  shootCooldown = Math.max(60, base - (laserLevel-1)*18);
  sfxShoot();
}

// ---------- power-up kits ----------
// kind: 'cytokine'(連射) / 'complement'(3方向) / 'tcell'(バリア) / 'heal'(回復)
const KITS={
  laser:     {color:'#ff5470', label:'抗体レーザー', sub:'威力アップ',   letter:'L'},
  cytokine:  {color:'#7ff0e2', label:'サイトカイン', sub:'連射強化',     letter:'C'},
  complement:{color:'#ffb703', label:'補体',        sub:'3方向拡散',    letter:'補'},
  tcell:     {color:'#5ad1c4', label:'T細胞増援',    sub:'バリア展開',   letter:'T'},
  heal:      {color:'#ff9ecb', label:'幹細胞',      sub:'防御回復',     letter:'+'},
};
function spawnItem(){
  // weighted pick: what the player still needs matters a bit
  const pool=[];
  if(laserLevel<4) pool.push('laser','laser','laser');
  if(powerLevel<2) pool.push('cytokine','cytokine');
  if(powerLevel<3) pool.push('complement','complement');
  pool.push('tcell','tcell','laser','cytokine');
  if(lives<maxLives) pool.push('heal','heal');
  const kind=pool[Math.floor(Math.random()*pool.length)];
  items.push({x:30+Math.random()*(W-60), y:-24, kind, r:15, wob:Math.random()*Math.PI*2});
}
function applyKit(kind){
  const k=KITS[kind];
  if(kind==='laser'){ laserLevel=Math.min(laserLevel+1,4);
    powerMsgText = laserLevel>=4? '抗体レーザー MAX：貫通' : k.label+'　Lv.'+laserLevel;
    powerMsgTimer=1600; burst(cell.x,cell.y,k.color,20); sfxPower(); return;
  }
  if(kind==='cytokine'){ powerLevel=Math.max(powerLevel,2); }
  else if(kind==='complement'){ powerLevel=3; }
  else if(kind==='tcell'){ barrier=Math.min(barrier+3,3); }
  else if(kind==='heal'){ if(lives<maxLives){lives++;renderHearts();} }
  powerMsgText=k.label+'　'+k.sub;
  powerMsgTimer=1600;
  burst(cell.x,cell.y,k.color,18);
  sfxPower();
}
function updateItems(dt){
  itemTimer+=dt;
  // periodic drop; first kit comes fairly early, then roughly every 12–16s
  const interval = 9000 + Math.random()*0; // base checked below
  if(itemTimer > (elapsed<9000?9000:12000+Math.random()*4000)){
    itemTimer=0; spawnItem();
  }
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    it.wob+=0.05; it.y+=1.4; it.x+=Math.sin(it.wob)*0.5;
    if(it.y>H+30){items.splice(i,1);continue;}
    if(Math.hypot(it.x-cell.x,it.y-cell.y)<it.r+18){
      applyKit(it.kind); items.splice(i,1);
    }
  }
}

// ---------- effects ----------
function burst(x,y,color,n=10){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*3.5;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,r:1+Math.random()*2.5});
  }
}
function showCombo(n){
  const c=document.getElementById('combo');
  c.textContent=n+' COMBO ×'+(1+Math.floor(n/5));
  c.style.opacity='1';clearTimeout(c._t);
  c._t=setTimeout(()=>c.style.opacity='0',700);
}
function showFact(){
  const f=facts[usedFact%facts.length];usedFact++;
  const t=document.getElementById('ticker');
  document.getElementById('tickerTag').textContent=f.tag;
  document.getElementById('tickerText').innerHTML=f.t;
  t.classList.add('show');clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),3600);
}
function loseLife(){
  if(barrier>0){
    barrier--;combo=0;
    burst(cell.x,cell.y,'#5ad1c4',18);
    powerMsgText='バリアが1枚割れた';powerMsgTimer=1100;
    sfxBarrier();
    return;
  }
  lives--;renderHearts();combo=0;
  // taking a hit weakens weapons slightly (グラディウス風)
  if(powerLevel>1)powerLevel--;
  if(laserLevel>1)laserLevel--;
  burst(cell.x,cell.y,'#ff5470',16);
  sfxHurt();
  if(lives<=0)gameOver();
}

// ---------- update ----------
function killEnemy(en,j){
  enemies.splice(j,1);combo++;comboTimer=1600;
  const mult=1+Math.floor(combo/5);
  const pts=(en.type==='virus'?15:en.maxhp>=4?20:10)*mult;
  score+=pts;document.getElementById('scoreVal').textContent=score;
  burst(en.x,en.y,en.type==='virus'?'#c77dff':'#ff5470',14);
  if(combo>1&&combo%3===0)showCombo(combo);
  if(Math.random()<0.45)showFact();
  sfxHit();
}
function updateBullets(dt){
  if(shootCooldown>0)shootCooldown-=dt;
  if(keys.shoot && shootCooldown<=0 && state==='play')shoot();
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];b.y+=b.vy;b.x+=(b.vx||0);
    if(b.y<-10||b.x<-10||b.x>W+10){bullets.splice(i,1);continue;}
    let consumed=false;
    for(let j=enemies.length-1;j>=0;j--){
      const en=enemies[j];
      const rad = b.pierce ? en.r+6 : en.r+4;
      if(Math.hypot(b.x-en.x,b.y-en.y)<rad){
        // piercing laser must not hit the same enemy twice
        if(b.pierce){ if(!en._id)en._id=++enemyIdSeq; if(b.hitIds.includes(en._id))continue; b.hitIds.push(en._id); }
        if(en.type==='ally'){
          burst(en.x,en.y,'#ffb703',14);enemies.splice(j,1);loseLife();
          if(!b.pierce){consumed=true;}
        }else{
          en.hp -= (b.power||1);
          burst(en.x,en.y,en.type==='virus'?'#c77dff':'#ff5470',6);
          if(en.hp<=0){ killEnemy(en,j); }
          if(!b.pierce){consumed=true;}
        }
        if(consumed)break;
      }
    }
    if(consumed)bullets.splice(i,1);
  }
}
let enemyIdSeq=0;
function updateEnemies(dt){
  for(let i=enemies.length-1;i>=0;i--){
    const en=enemies[i];
    en.wob+=0.05;
    en.y+=en.vy;
    if(en.dive){ en.x += (cell.x-en.x)*0.012; }
    en.x+=Math.sin(en.wob)*en.weave;
    en.x=Math.max(en.r,Math.min(W-en.r,en.x));
    if(en.y>H+30){
      enemies.splice(i,1);
      if(en.type!=='ally')loseLife();
    }
  }
  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)combo=0;}
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vx*=0.94;p.vy*=0.94;p.life-=0.03;
    if(p.life<=0)particles.splice(i,1);
  }
}

// ---------- drawing ----------
let bgT=0;
function drawBackground(){
  bgT+=0.5;
  // retro pixel starfield (blocky squares scrolling down)
  for(let i=0;i<26;i++){
    const x=Math.floor(((i*131)%W)/3)*3;
    const y=Math.floor((((i*71)+bgT*(1+(i%3)*0.6))%(H+20)))-10;
    const py=Math.floor(y/3)*3;
    const s=i%4===0?3:2;
    ctx.fillStyle = i%5===0?'rgba(123,255,230,0.35)': i%3===0?'rgba(192,96,255,0.3)':'rgba(255,255,255,0.18)';
    ctx.fillRect(x,py,s,s);
  }
}
function drawCell(){
  const {x,y}=cell;
  // barrier rings (T細胞増援)
  if(barrier>0){
    for(let k=0;k<barrier;k++){
      const rr=24+k*5+Math.sin(elapsed/200+k)*1.5;
      ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);
      ctx.strokeStyle='rgba(90,209,196,'+(0.5-k*0.12)+')';ctx.lineWidth=2;ctx.stroke();
    }
  }
  ctx.fillStyle='rgba(127,240,226,.9)';
  ctx.fillRect(x-3,y-26,6,14);
  // extra barrels when powered up
  if(powerLevel>=3){
    ctx.fillRect(x-11,y-20,5,10);ctx.fillRect(x+6,y-20,5,10);
  }else if(powerLevel>=2){
    ctx.fillStyle='rgba(127,240,226,1)';ctx.fillRect(x-3,y-28,6,16);
  }
  ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);
  const g=ctx.createRadialGradient(x-4,y-4,2,x,y,18);
  g.addColorStop(0,'#f4fbfd');g.addColorStop(1,'#a8d8d0');
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(90,209,196,.8)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='rgba(90,150,180,.55)';
  for(const o of [[-5,-3],[5,-2],[0,5]]){
    ctx.beginPath();ctx.arc(x+o[0],y+o[1],4,0,Math.PI*2);ctx.fill();
  }
}
function drawItems(){
  for(const it of items){
    const k=KITS[it.kind];
    ctx.save();ctx.translate(it.x,it.y);
    const pulse=1+Math.sin(it.wob*2)*0.06;
    ctx.scale(pulse,pulse);
    // glowing capsule
    ctx.shadowColor=k.color;ctx.shadowBlur=14;
    ctx.beginPath();
    ctx.roundRect?ctx.roundRect(-it.r,-it.r,it.r*2,it.r*2,6):ctx.rect(-it.r,-it.r,it.r*2,it.r*2);
    ctx.fillStyle='rgba(10,22,40,.85)';ctx.fill();
    ctx.shadowBlur=0;
    ctx.lineWidth=2;ctx.strokeStyle=k.color;ctx.stroke();
    // letter
    ctx.fillStyle=k.color;
    ctx.font='11px "Press Start 2P","DotGothic16",monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(k.letter,0,1);
    ctx.restore();
  }
}
function drawPowerMsg(){
  if(powerMsgTimer<=0)return;
  const a=Math.min(1,powerMsgTimer/400);
  ctx.globalAlpha=a;
  ctx.fillStyle='#ffd000';
  ctx.font='13px "DotGothic16","Press Start 2P",monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(powerMsgText, W/2, H*0.42);
  ctx.globalAlpha=1;ctx.textAlign='left';
}
function drawEnemies(){
  for(const en of enemies){
    ctx.save();ctx.translate(en.x,en.y);
    if(en.type==='bacteria'){
      ctx.fillStyle='#ff5470';
      ctx.beginPath();ctx.ellipse(0,0,en.r,en.r*0.68,en.wob*0.5,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,84,112,.6)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(en.r*.7,0);
      ctx.quadraticCurveTo(en.r+6,Math.sin(en.wob*2)*5,en.r+12,0);ctx.stroke();
      ctx.fillStyle='rgba(120,10,30,.5)';
      ctx.beginPath();ctx.arc(-3,0,3,0,Math.PI*2);ctx.fill();
      if(en.maxhp>1){
        ctx.strokeStyle='rgba(255,255,255,'+(0.15+0.5*en.hp/en.maxhp)+')';
        ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,en.r+3,-Math.PI/2,-Math.PI/2+Math.PI*2*en.hp/en.maxhp);ctx.stroke();
      }
    }else if(en.type==='virus'){
      ctx.fillStyle=en.dive?'#e0b3ff':'#c77dff';
      ctx.beginPath();ctx.arc(0,0,en.r*0.7,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#c77dff';ctx.lineWidth=2.5;
      for(let k=0;k<8;k++){
        const a=en.wob*0.4+k*Math.PI/4;
        ctx.beginPath();ctx.moveTo(Math.cos(a)*en.r*0.7,Math.sin(a)*en.r*0.7);
        ctx.lineTo(Math.cos(a)*en.r*1.15,Math.sin(a)*en.r*1.15);ctx.stroke();
        ctx.beginPath();ctx.arc(Math.cos(a)*en.r*1.2,Math.sin(a)*en.r*1.2,2.5,0,Math.PI*2);
        ctx.fillStyle='#e0b3ff';ctx.fill();ctx.fillStyle='#c77dff';
      }
    }else{
      const g=ctx.createRadialGradient(-4,-4,2,0,0,en.r);
      g.addColorStop(0,'#ffe08a');g.addColorStop(1,'#ffb703');
      ctx.fillStyle=g;ctx.beginPath();
      for(let k=0;k<=12;k++){
        const a=k/12*Math.PI*2;
        const rr=en.r*(0.85+0.18*Math.sin(a*3+en.wob));
        const px=Math.cos(a)*rr,py=Math.sin(a)*rr;
        k===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
      }
      ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(140,90,0,.4)';
      ctx.beginPath();ctx.arc(2,1,5,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
}
function drawBullets(){
  for(const b of bullets){
    const lv=b.lv||1;
    if(b.laser){
      // 貫通レーザー：縦に伸びるビーム
      ctx.save();
      ctx.strokeStyle='#ff5470';ctx.shadowColor='#ff5470';ctx.shadowBlur=14;
      ctx.lineWidth=5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(b.x,b.y-16);ctx.lineTo(b.x,b.y+8);ctx.stroke();
      ctx.strokeStyle='#fff';ctx.lineWidth=1.6;
      ctx.beginPath();ctx.moveTo(b.x,b.y-16);ctx.lineTo(b.x,b.y+8);ctx.stroke();
      ctx.restore();
      continue;
    }
    const col = lv>=3?'#ffd166' : lv>=2?'#a8ffe6' : '#7ff0e2';
    const size = lv>=3?5 : lv>=2?4.5 : 4;
    ctx.beginPath();ctx.arc(b.x,b.y,size,0,Math.PI*2);
    ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=10;
    ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(b.x,b.y+3);ctx.lineTo(b.x,b.y-1);
    ctx.moveTo(b.x,b.y-1);ctx.lineTo(b.x-3,b.y-4);
    ctx.moveTo(b.x,b.y-1);ctx.lineTo(b.x+3,b.y-4);ctx.stroke();
  }
}
function drawParticleLayer(){
  for(const p of particles){
    ctx.globalAlpha=p.life;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color;ctx.fill();ctx.globalAlpha=1;
  }
}

// ---------- game over ----------
let lastEntry=null;
function gameOver(){
  state='over';
  stopMusic();
  if(musicOn&&audioCtx){
    beep(330,0.2,'sawtooth',0.18);
    beep(247,0.25,'sawtooth',0.18,audioCtx.currentTime+0.18);
    beep(196,0.45,'sawtooth',0.2,audioCtx.currentTime+0.36);
  }
  const result=saveScore(playerName,score);
  document.getElementById('finalScore').textContent=score;
  let rank;
  if(score>=1600)rank='RANK S ── 免疫記憶マスター';
  else if(score>=1000)rank='RANK A ── 頼れる白血球';
  else if(score>=500)rank='RANK B ── 免疫応答、良好';
  else rank='RANK C ── 感染拡大中…再挑戦を';
  document.getElementById('rankText').textContent=rank+'　（総合 '+result.rank+'位）';
  document.getElementById('newBest').classList.toggle('hidden', !(result.isBest));
  const f=endFacts[Math.floor(Math.random()*endFacts.length)];
  document.getElementById('factCard').innerHTML='<span class="tag">'+f.tag+'</span>'+f.t;
  lastEntry=result.entry;
  document.getElementById('overScreen').classList.remove('hidden');
}

// ---------- loop ----------
let last=0;
function loop(ts){
  const dt=Math.min(ts-last,40);last=ts;
  ctx.clearRect(0,0,W,H);
  drawBackground();
  if(state==='play'){
    elapsed+=dt;updateWave();
    const d=difficulty();
    spawnTimer+=dt;
    if(spawnTimer>d.gap){
      spawnTimer=0;spawnOne(d);
      for(let k=0;k<d.burst;k++)spawnOne(d);
    }
    const accel=1.35,maxv=9.2;
    if(keys.left)cell.vx-=accel;
    if(keys.right)cell.vx+=accel;
    if(keys.up)cell.vy-=accel;
    if(keys.down)cell.vy+=accel;
    cell.vx*=0.80;cell.vy*=0.80;
    cell.vx=Math.max(-maxv,Math.min(maxv,cell.vx));
    cell.vy=Math.max(-maxv,Math.min(maxv,cell.vy));
    cell.x+=cell.vx;cell.y+=cell.vy;
    cell.x=Math.max(20,Math.min(W-20,cell.x));
    // 自機は下半分〜画面全体を動けるが、上端付近には行けない（画面上部HUD保護）
    cell.y=Math.max(H*0.28,Math.min(H-24,cell.y));
    if(powerMsgTimer>0)powerMsgTimer-=dt;
    updateBullets(dt);updateEnemies(dt);updateItems(dt);
  }
  updateParticles();
  drawEnemies();drawItems();drawParticleLayer();drawBullets();
  if(state==='play'){drawCell();drawPowerMsg();}
  requestAnimationFrame(loop);
}

// ---------- screen flow ----------
function goName(){
  state='name';
  document.getElementById('overScreen').classList.add('hidden');
  document.getElementById('rankScreen').classList.add('hidden');
  document.getElementById('nameScreen').classList.remove('hidden');
  document.getElementById('nameInput').focus();
}
function startGame(){
  const nm=document.getElementById('nameInput').value.trim();
  playerName = nm || '名無しの白血球';
  document.getElementById('nameScreen').classList.add('hidden');
  document.getElementById('overScreen').classList.add('hidden');
  document.getElementById('rankScreen').classList.add('hidden');
  resize();initGame();state='play';
  stage.focus();
}
function showRanking(){
  state='ranking';
  document.getElementById('overScreen').classList.add('hidden');
  document.getElementById('nameScreen').classList.add('hidden');
  renderRanking(lastEntry);
  document.getElementById('rankScreen').classList.remove('hidden');
}

document.getElementById('startBtn').onclick=startGame;
document.getElementById('againBtn').onclick=startGame;
document.getElementById('rankAgainBtn').onclick=goName;
document.getElementById('rankBtn').onclick=showRanking;
document.getElementById('clearBtn').onclick=()=>{
  const input=prompt('記録を消去するには管理コードを入力してください');
  if(input===null)return; // キャンセル
  // 管理コードは画面・説明に出さず、ソース上も難読化して保持
  const expected=atob('a291bW9yaWRhaXN1a2k=');
  if(input.trim()===expected){
    localStorage.removeItem(RKEY);renderRanking();
    alert('記録を消去しました。');
  }else{
    alert('コードが違います。記録は消去されませんでした。');
  }
};
document.getElementById('nameInput').addEventListener('keydown',e=>{
  if(e.key==='Enter')startGame();
});
document.getElementById('muteBtn').onclick=()=>{toggleMusic();stage.focus();};

resize();
document.getElementById('nameInput').focus();
requestAnimationFrame(loop);
</script>
